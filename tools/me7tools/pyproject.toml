[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "me7tools"
version = "0.1.0"
description = "ME7 flash image probe, shared pattern matcher, Ghidra label TSV builders, and map decoder"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
me7probe = "me7tools.probe:main"
me7labels = "me7tools.labels:main"
me7modules = "me7tools.frmodules:main"
me7map = "me7tools.maps:main"

[tool.setuptools]
packages = ["me7tools"]
