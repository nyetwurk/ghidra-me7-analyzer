# Test and package on every push and PR. The work is in the Makefile; see README "Releases".
name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_call:  # release.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Extension zips only install into the Ghidra version they were built against.
        ghidra: [ '12.1.2', '12.1.4' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git describe needs tags
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: build/ghidra
          key: ghidra-${{ matrix.ghidra }}
      - name: make test extension
        run: make test extension GHIDRA_INSTALL_DIR=download GHIDRA_VERSION=${{ matrix.ghidra }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: ME7Ghidra-ghidra_${{ matrix.ghidra }}
          path: ghidra-extension/dist/ME7Ghidra-*-ghidra_${{ matrix.ghidra }}.zip
